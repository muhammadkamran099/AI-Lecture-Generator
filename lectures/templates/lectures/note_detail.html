<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ session.title }} - Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">🎓 AI Lecture Assistant</a>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm">Dashboard</a>
        </div>
    </nav>
    <div class="container mb-5" style="max-width: 800px;">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2>{{ session.title }}</h2>
                <p class="text-muted">Uploaded on {{ session.created_at|date:"F d, Y at H:i" }}</p>
                <hr>
                <h4 class="text-primary">Summary & Key Takeaways</h4>
                <div class="bg-white p-3 border rounded mb-4" style="white-space: pre-wrap; font-family: inherit;">{{ note.summary_markdown }}</div>
                
                <h4 class="text-secondary">Raw Transcript</h4>
                <div class="bg-secondary bg-opacity-10 p-3 rounded text-muted small" style="white-space: pre-wrap;">{{ note.raw_transcript }}</div>
            </div>
        </div>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">&larr; Back to Dashboard</a>
    </div>
</body>
</html>
