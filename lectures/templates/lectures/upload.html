<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Lecture - AI Lecture Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="mb-3">Upload Lecture Audio</h3>
                <p class="text-muted">Upload an audio recording to automatically generate summaries and transcripts.</p>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-2">Process Lecture</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'dashboard' %}" class="text-decoration-none">&larr; Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
